services:
  ctf-web:
    build: .
    environment:
      - DATABASE_URL=mysql+pymysql://ctfuser:ctfpassword@ctf-db/ctfapp
      - SECRET_KEY=dev-key-change-me
    depends_on:
      - ctf-db
    restart: unless-stopped

  ctf-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=ctfapp
      - MYSQL_USER=ctfuser
      - MYSQL_PASSWORD=ctfpassword
    volumes:
      - ctf_db_data:/var/lib/mysql
    restart: unless-stopped

  sqli-challenge:
    build: ./challenge-artifacts/sqli-login
    ports:
      - "5001:5001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ctf-web
    restart: unless-stopped

volumes:
  ctf_db_data:
